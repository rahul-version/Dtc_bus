apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dtc-journey-ingress
  namespace: dtc-transit
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
  - host: dtc-journey.delhi.gov.in
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: dtc-backend-service
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dtc-frontend-service
            port:
              number: 80
