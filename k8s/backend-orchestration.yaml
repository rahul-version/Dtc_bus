apiVersion: apps/v1
kind: Deployment
metadata:
  name: dtc-backend-deployment
  namespace: dtc-transit
  labels:
    app: dtc-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dtc-backend
  template:
    metadata:
      labels:
        app: dtc-backend
    spec:
      containers:
      - name: dtc-backend
        image: dtc-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: RATE_LIMIT_REQUESTS_PER_MINUTE
          value: "300"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1536Mi"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dtc-backend-hpa
  namespace: dtc-transit
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dtc-backend-deployment
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: v1
kind: Service
metadata:
  name: dtc-backend-service
  namespace: dtc-transit
spec:
  type: ClusterIP
  selector:
    app: dtc-backend
  ports:
  - port: 8000
    targetPort: 8000
